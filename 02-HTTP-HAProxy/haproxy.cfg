
global
    log /dev/log local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 500ms
    timeout client 30s
    timeout server 30s
    timeout check 500ms

frontend crl_frontend
    bind *:80
    mode http
    default_backend crl_backends

backend crl_backends
    mode http
    balance roundrobin

    option httpchk
    http-check send meth GET uri /crl/Corp-Root-CA.crl ver HTTP/1.1 hdr Host crl-nlb.corp.michaelwaterman.nl
    http-check expect status 200

    default-server inter 200ms fastinter 100ms downinter 500ms fall 2 rise 2

    server cdp1 192.168.66.5:80 check
    server cdp2 192.168.66.6:80 check
    server cdp3 192.168.66.7:80 check
